<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" fill="none" style="width: 100%; height: auto; max-height: 380px;">
  <defs>
    <linearGradient id="bgArchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="chartBarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- BACKGROUND ARCHITECTURAL SHAPES & MONITORING THEME -->
  <path d="M70 360 V 160 A 130 130 0 0 1 330 160 V 360 Z" fill="url(#bgArchGrad)" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.75" />
  <circle cx="200" cy="160" r="110" stroke="#bae6fd" stroke-width="1.5" stroke-dasharray="4 4" fill="none" opacity="0.6" />
  <ellipse cx="200" cy="160" rx="45" ry="110" stroke="#bae6fd" stroke-width="1.2" fill="none" opacity="0.4" />
  <line x1="90" y1="160" x2="310" y2="160" stroke="#bae6fd" stroke-width="1.2" opacity="0.4" />

  <!-- FLOATING PERFORMANCE STATS CARD (Top Right of Illustration) -->
  <g filter="url(#softShadow)" transform="translate(320, 50)">
    <rect width="160" height="74" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2" />
    <circle cx="26" cy="26" r="14" fill="#e0f2fe" />
    <path d="M20 28 L24 32 L32 21" stroke="#0284c7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="48" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#64748b">Capaian Kinerja</text>
    <text x="48" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="900" fill="#0f172a">98.4%</text>
    <rect x="20" y="48" width="120" height="6" rx="3" fill="#f1f5f9" />
    <rect x="20" y="48" width="105" height="6" rx="3" fill="url(#chartBarGrad)" />
  </g>

  <!-- FLOATING MINI BADGE (Left) -->
  <g filter="url(#softShadow)" transform="translate(40, 110)">
    <rect width="118" height="40" rx="20" fill="#ffffff" stroke="#fde68a" stroke-width="1" />
    <circle cx="20" cy="20" r="9" fill="#fef3c7" />
    <circle cx="20" cy="20" r="4" fill="#f59e0b" />
    <text x="36" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#92400e">IKK Terpadu</text>
  </g>

  <!-- GROUND / FLOOR LINE -->
  <line x1="30" y1="365" x2="490" y2="365" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" />

  <!-- ══════════════════════════════════════════════════
       FIGURE 1 (LEFT) — MODERN ANALYST IN AMBER / TEAL
       ══════════════════════════════════════════════════ -->
  <g class="character-1" transform="translate(60, 95)">
    <!-- Head & Hair -->
    <ellipse cx="45" cy="40" rx="13" ry="16" fill="#fbd5b5" />
    <path d="M33 36 C 33 22, 57 22, 57 34 C 55 24, 40 23, 33 36 Z" fill="#8d5b4c" />
    <!-- Neck -->
    <rect x="41" y="54" width="8" height="12" fill="#fbd5b5" />
    <!-- Yellow / Amber Oversized Shirt -->
    <path d="M22 66 C 30 63, 60 63, 68 66 L 73 148 C 65 152, 25 152, 17 148 Z" fill="url(#goldGrad)" />
    <!-- Shirt Texture Lines -->
    <path d="M28 80 Q 45 92 62 80 M 24 105 Q 45 118 66 105 M 26 130 Q 45 142 64 130" stroke="#d97706" stroke-width="1.2" fill="none" opacity="0.45" />
    <!-- Teal Wide Pants -->
    <path d="M18 148 L 39 148 L 38 245 L 14 245 Z" fill="#0d9488" />
    <path d="M41 148 L 68 148 L 68 245 L 43 245 Z" fill="#0f766e" />
    <!-- Cuff Stripe -->
    <line x1="14" y1="230" x2="38" y2="230" stroke="#5eead4" stroke-width="2" />
    <line x1="43" y1="230" x2="68" y2="230" stroke="#5eead4" stroke-width="2" />
    <!-- Socks & Dark Shoes -->
    <rect x="18" y="245" width="12" height="15" fill="#38bdf8" />
    <path d="M12 258 C 12 254, 30 254, 34 262 L 6 262 Z" fill="#0f172a" />
    <rect x="48" y="245" width="12" height="15" fill="#38bdf8" />
    <path d="M42 258 C 42 254, 60 254, 64 262 L 36 262 Z" fill="#0f172a" />
  </g>

  <!-- ══════════════════════════════════════════════════
       FIGURE 2 (CENTER-LEFT) — FEMALE LEAD IN PATTERNED BLUE BLOUSE
       ══════════════════════════════════════════════════ -->
  <g class="character-2" transform="translate(142, 115)">
    <!-- Hair Bun & Head -->
    <circle cx="48" cy="20" r="10" fill="#653b2b" />
    <ellipse cx="48" cy="38" rx="12" ry="14" fill="#fbd5b5" />
    <path d="M37 32 C 37 20, 59 20, 59 32 C 55 24, 43 24, 37 32 Z" fill="#653b2b" />
    <!-- Neck -->
    <rect x="45" y="50" width="6" height="10" fill="#fbd5b5" />
    <!-- Patterned Blue / White Blouse -->
    <path d="M26 60 C 35 57, 61 57, 70 60 L 73 135 C 64 138, 32 138, 23 135 Z" fill="#2563eb" />
    <!-- Abstract Dots Pattern -->
    <circle cx="34" cy="74" r="2.5" fill="#ffffff" opacity="0.9" />
    <circle cx="50" cy="70" r="3" fill="#ffffff" opacity="0.9" />
    <circle cx="62" cy="78" r="2" fill="#ffffff" opacity="0.9" />
    <circle cx="42" cy="88" r="3.5" fill="#ffffff" opacity="0.9" />
    <circle cx="58" cy="94" r="2.5" fill="#ffffff" opacity="0.9" />
    <circle cx="32" cy="102" r="3" fill="#ffffff" opacity="0.9" />
    <circle cx="48" cy="112" r="3" fill="#ffffff" opacity="0.9" />
    <circle cx="63" cy="118" r="2.5" fill="#ffffff" opacity="0.9" />
    <circle cx="36" cy="126" r="2" fill="#ffffff" opacity="0.9" />
    <!-- Dark Navy Patterned Culottes -->
    <path d="M24 135 L 47 135 L 43 230 L 19 230 Z" fill="#0f172a" />
    <path d="M49 135 L 72 135 L 75 230 L 49 230 Z" fill="#1e293b" />
    <!-- Subtle Swirl Pattern on Culottes -->
    <path d="M25 155 Q 35 170 27 185 Q 38 200 24 215" stroke="#334155" stroke-width="1.8" fill="none" opacity="0.6" />
    <path d="M57 150 Q 67 170 58 190 Q 69 205 55 220" stroke="#334155" stroke-width="1.8" fill="none" opacity="0.6" />
    <!-- Mustard Socks & Dark Shoes -->
    <rect x="22" y="230" width="10" height="15" fill="#f59e0b" />
    <path d="M16 242 C 16 238, 32 238, 36 246 L 10 246 Z" fill="#0284c7" />
    <rect x="58" y="230" width="10" height="15" fill="#f59e0b" />
    <path d="M52 242 C 52 238, 68 238, 72 246 L 46 246 Z" fill="#0284c7" />
  </g>

  <!-- ══════════════════════════════════════════════════
       FIGURE 3 (CENTER-RIGHT) — ANALYST IN TEAL TOP & MUSTARD SKIRT
       ══════════════════════════════════════════════════ -->
  <g class="character-3" transform="translate(230, 120)">
    <!-- Head & Short Bob Hair -->
    <ellipse cx="44" cy="35" rx="11" ry="14" fill="#fbd5b5" />
    <path d="M30 30 C 30 18, 58 18, 58 30 C 58 45, 54 48, 54 48 C 50 34, 40 34, 34 48 C 34 48, 30 45, 30 30 Z" fill="#9a3412" />
    <!-- Neck -->
    <rect x="41" y="47" width="6" height="10" fill="#fbd5b5" />
    <!-- Teal / Green T-Shirt -->
    <path d="M25 57 C 33 54, 55 54, 63 57 L 66 120 C 58 123, 30 123, 22 120 Z" fill="#0d9488" />
    <!-- High-Waist Mustard Pants/Culottes -->
    <path d="M22 120 L 43 120 L 41 225 L 18 225 Z" fill="#eab308" />
    <path d="M45 120 L 66 120 L 69 225 L 46 225 Z" fill="#ca8a04" />
    <!-- White leaf accents on pants -->
    <path d="M27 140 Q 33 150 29 160 M 34 175 Q 40 185 35 195 M 54 135 Q 60 145 56 155 M 58 180 Q 64 190 59 200" stroke="#fef08a" stroke-width="1.4" fill="none" opacity="0.6" />
    <!-- Cobalt Socks & Minimalist Shoes -->
    <rect x="22" y="225" width="10" height="15" fill="#2563eb" />
    <path d="M16 238 C 16 234, 32 234, 36 242 L 10 242 Z" fill="#0f172a" />
    <rect x="52" y="225" width="10" height="15" fill="#2563eb" />
    <path d="M46 238 C 46 234, 62 234, 66 242 L 40 242 Z" fill="#0f172a" />
  </g>

  <!-- ══════════════════════════════════════════════════
       FIGURE 4 (RIGHT) — SENIOR SPECIALIST IN NAVY & ROYAL BLUE
       ══════════════════════════════════════════════════ -->
  <g class="character-4" transform="translate(315, 95)">
    <!-- Head & Short Clean Hair -->
    <ellipse cx="48" cy="38" rx="12" ry="15" fill="#fbd5b5" />
    <path d="M37 32 C 37 20, 59 20, 59 32 C 57 23, 44 23, 37 32 Z" fill="#475569" />
    <!-- Glasses -->
    <circle cx="44" cy="38" r="4.5" stroke="#0f172a" stroke-width="1.2" fill="none" />
    <circle cx="53" cy="38" r="4.5" stroke="#0f172a" stroke-width="1.2" fill="none" />
    <line x1="48.5" y1="38" x2="49.5" y2="38" stroke="#0f172a" stroke-width="1.2" />
    <!-- Neck -->
    <rect x="44" y="52" width="8" height="12" fill="#fbd5b5" />
    <!-- Dark Navy T-Shirt -->
    <path d="M24 64 C 33 61, 63 61, 72 64 L 76 138 C 67 142, 29 142, 20 138 Z" fill="url(#navyGrad)" />
    <!-- Royal Blue Cropped Pants -->
    <path d="M21 138 L 46 138 L 44 242 L 20 242 Z" fill="#3b82f6" />
    <path d="M48 138 L 74 138 L 76 242 L 50 242 Z" fill="#2563eb" />
    <!-- Sky Blue Socks & Dark Shoes -->
    <rect x="24" y="242" width="12" height="15" fill="#38bdf8" />
    <path d="M18 255 C 18 251, 36 251, 40 259 L 12 259 Z" fill="#0f172a" />
    <rect x="56" y="242" width="12" height="15" fill="#38bdf8" />
    <path d="M50 255 C 50 251, 68 251, 72 259 L 44 259 Z" fill="#0f172a" />
  </g>
</svg>