<svg width="500" height="130" viewBox="0 0 500 130" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Gradients -->
        <linearGradient id="simonikaGradIcon" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#1E3A8A" />
            <stop offset="50%" stop-color="#2563EB" />
            <stop offset="100%" stop-color="#0284C7" />
        </linearGradient>
        <linearGradient id="simonikaGradText" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#0F172A" />
            <stop offset="100%" stop-color="#1E40AF" />
        </linearGradient>
        <linearGradient id="simonikaGradArrow" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0%" stop-color="#10B981" />
            <stop offset="50%" stop-color="#38BDF8" />
            <stop offset="100%" stop-color="#FFFFFF" />
        </linearGradient>
        <!-- Filter Shadow -->
        <filter id="simonikaShadow" x="-10%" y="-10%" width="130%" height="130%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1D4ED8" flood-opacity="0.25" />
        </filter>
    </defs>

    <!-- ICON CONTAINER (Emblem Box) -->
    <g transform="translate(15, 15)">
        <!-- Outer Rounded Square with Gradient & Shadow -->
        <rect width="100" height="100" rx="24" fill="url(#simonikaGradIcon)" filter="url(#simonikaShadow)" />
        <rect x="1" y="1" width="98" height="98" rx="23" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5" />

        <!-- Radar / Monitoring Circles (Pengawasan Berkelanjutan) -->
        <circle cx="50" cy="50" r="38" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="3 3" />
        <circle cx="50" cy="50" r="26" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5" />

        <!-- Bar Charts (Kinerja & Anggaran) -->
        <rect x="26" y="52" width="8" height="26" rx="3.5" fill="#FFFFFF" fill-opacity="0.65" />
        <rect x="38" y="40" width="8" height="38" rx="3.5" fill="#38BDF8" />
        <rect x="50" y="32" width="8" height="46" rx="3.5" fill="#FACC15" />
        <rect x="62" y="24" width="8" height="54" rx="3.5" fill="#10B981" />

        <!-- Dynamic Swoosh / Growth Arrow (Sayap Perhubungan & Tren Progresif) -->
        <path d="M 22 62 Q 46 42 74 24" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" fill="none" />
        <polygon points="76,18 82,25 70,27" fill="#FFFFFF" />
        
        <!-- Glowing Dot at Target Peak -->
        <circle cx="76" cy="22" r="3" fill="#FACC15" />
    </g>

    <!-- TYPOGRAPHY / BRAND TEXT -->
    <g transform="translate(138, 25)">
        <!-- Brand Title: SIMONIKA -->
        <text x="0" y="42" font-family="'Plus Jakarta Sans', 'Segoe UI', Inter, sans-serif" font-weight="900" font-size="44" fill="url(#simonikaGradText)" letter-spacing="-0.02em">
            SIMONIKA
        </text>

        <!-- Institution Pill Badge -->
        <rect x="238" y="16" width="92" height="24" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1" />
        <text x="284" y="32.5" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="11" fill="#1D4ED8" text-anchor="middle" letter-spacing="0.06em">
            PPSDMAP
        </text>

        <!-- Subtitle: Kepanjangan Nama Sistem -->
        <text x="2" y="66" font-family="'Plus Jakarta Sans', 'Segoe UI', Inter, sans-serif" font-weight="700" font-size="14" fill="#334155" letter-spacing="0.01em">
            Sistem Informasi Monitoring Kinerja dan Anggaran
        </text>

        <!-- Agency Tagline -->
        <text x="2" y="85" font-family="'Plus Jakarta Sans', 'Segoe UI', Inter, sans-serif" font-weight="600" font-size="11.5" fill="#64748B" letter-spacing="0.03em">
            Pusat Pengembangan SDM Aparatur Perhubungan • Kemenhub RI
        </text>
    </g>
</svg>

